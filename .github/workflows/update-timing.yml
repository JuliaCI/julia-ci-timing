name: Update CI Timing Data

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# One update at a time: a push-triggered run racing a scheduled run could
# otherwise deploy stale data over fresh or fail the data push.
concurrency:
  group: update-timing
  cancel-in-progress: false

jobs:
  changes:
    # Whether a push touched a fetcher or this workflow. Decided from a git
    # diff against the previous tip: the push payload's head_commit.modified
    # list, which the job gate used before, never matched such pushes.
    runs-on: ubuntu-latest
    outputs:
      fetch: ${{ steps.diff.outputs.fetch }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'push'
      - name: Diff against the previous tip
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "fetch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A new branch or an unreachable previous tip: run rather than guess
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git fetch --depth=1 --quiet origin "$BEFORE"; then
            echo "fetch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD -- 'fetch_*.jl' .github/workflows/update-timing.yml)
          if [[ -n "$changed" ]]; then
            echo "Fetchers changed:"; echo "$changed"
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          else
            echo "No fetcher changes; deploy only"
            echo "fetch=false" >> "$GITHUB_OUTPUT"
          fi

  fetch-and-update:
    # Data fetch on schedule, manual trigger, or a push that changed a fetcher
    needs: changes
    if: needs.changes.outputs.fetch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The branch tip, not the pushed commit: a data commit made while
          # this run was queued would otherwise conflict on the binary files
          ref: main

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Cache NanosoldierReports clone
        uses: actions/cache@v5
        with:
          path: .cache/NanosoldierReports
          key: nanosoldier-reports-${{ github.run_id }}
          restore-keys: |
            nanosoldier-reports-

      - name: Install dependencies
        run: |
          julia --color=yes --project -e 'using Pkg; Pkg.instantiate()'

      - name: Fetch timing data
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
        run: |
          julia --color=yes --project fetch_timing.jl

      - name: Fetch benchmark data
        run: |
          julia --color=yes --project fetch_benchmarks.jl

      - name: Fetch pkgeval data
        run: |
          julia --color=yes --project fetch_pkgeval.jl

      - name: Fetch package downloads data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          julia --color=yes --project fetch_packages.jl

      - name: Fetch TTFX data
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
        run: |
          julia --color=yes --project fetch_ttfx.jl

      - name: Commit updated data
        # A failed fetcher must not discard what the others wrote; the push
        # of that commit deploys it in a fresh run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update timing data"
            # main may have advanced during the long fetch step. Should a
            # data commit have landed in between, this run's files (theirs,
            # in rebase terms) win rather than failing the run.
            git pull --rebase -X theirs origin main
            git push
          fi

  deploy-pages:
    # Always deploy on push, but wait for fetch-and-update if it ran
    if: always() && (needs.fetch-and-update.result == 'success' || needs.fetch-and-update.result == 'skipped')
    needs: [changes, fetch-and-update]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main  # Get latest after data update

      - name: Inject build commit
        run: |
          COMMIT=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "Injecting commit: $SHORT ($COMMIT)"
          sed -i "s|__BUILD_COMMIT__|$COMMIT|g" index.html
          sed -i "s|__BUILD_COMMIT_SHORT__|$SHORT|g" index.html
          grep -o 'build-commit.*' index.html | head -1

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
