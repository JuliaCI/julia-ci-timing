name: Compare origins

# The stage 1 gate of docs/database-migration.md: once a day, check that the
# AWS host serves every settled row the Pages site does, with fresh files
# and a disk below 80% (db/compare_origins.jl), and that the latest backup
# in S3 is under a day old. Schedules and workflow_dispatch only run from
# the default branch; until this lands on main, run the gate locally:
#   julia --project db/compare_origins.jl https://perf.julialang.org http://3.82.159.74

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Install dependencies
        run: |
          julia --color=yes --project -e 'using Pkg; Pkg.instantiate()'

      - name: Compare the Pages site with the host
        shell: bash
        env:
          # The host's URL, once it has a hostname; the EIP until then
          CANDIDATE: ${{ vars.CI_TIMING_SITE_URL || 'http://3.82.159.74' }}
        run: |
          julia --color=no --project db/compare_origins.jl https://perf.julialang.org "$CANDIDATE" | tee report.txt

      - name: Configure AWS credentials (OIDC)
        if: always()
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.CI_TIMING_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Latest backup is under a day old
        if: always()
        shell: bash
        run: |
          modified=$(aws s3api list-objects-v2 --bucket ci-timing-393686272827-us-east-1-backups \
            --prefix runtime/latest.tar.gz --query 'Contents[0].LastModified' --output text)
          age=$(( $(date -u +%s) - $(date -u -d "$modified" +%s) ))
          echo "latest backup: $modified ($((age / 3600)) h ago)" | tee -a report.txt
          [ "$age" -lt 86400 ] || { echo "backup older than a day"; exit 1; }

      - name: Job summary
        if: always()
        run: |
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
