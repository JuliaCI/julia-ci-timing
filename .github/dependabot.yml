version: 2
# One pull request per ecosystem a week, not one per dependency
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]

  # Project.toml compat and the tracked Manifest.toml
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]

  # The julia base image of the ingest image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]

  # Datasette, installed into the ingest image
  - package-ecosystem: "pip"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]

  # The AWS provider (versions.tf and the lock file); the Caddy image tag in
  # main.tf is a plain string Dependabot cannot follow
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]
